<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Mote">
  <!-- The brand symbol from DESIGN.md, drawn once here and rasterised into every icon size by
       `pnpm assets`. Structure (the frame), the corner cells it is pinned to, and one lit core:
       "a single point of energy surrounded by structure". Hex, not oklch, because a favicon is
       rendered by the browser chrome and by tools that are not a full CSS engine. -->
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ce" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#00e5ce" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00e5ce" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#06070a"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#262c32"/>
  <circle cx="16" cy="16" r="11" fill="url(#core-glow)"/>
  <rect x="9" y="9" width="14" height="14" fill="none" stroke="#1e8276" stroke-width="1.5"/>
  <rect x="21.25" y="7.25" width="3.5" height="3.5" fill="#00e5ce"/>
  <rect x="7.25" y="21.25" width="3.5" height="3.5" fill="#00e5ce"/>
  <rect x="13" y="13" width="6" height="6" fill="#00e5ce"/>
</svg>
